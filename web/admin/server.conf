map $http_x_forwarded_proto $security_forwarded_proto {
    default $scheme;
    https https;
}

upstream backend {
    server api:8000;
}

server {
    charset utf-8;
    server_tokens off;
    absolute_redirect off;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' http: https:; media-src 'self' blob: http: https:; frame-src 'self' blob: http: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    proxy_hide_header X-Powered-By;
    listen 127.0.0.1:8081 default_server;
    if ($security_host_allowed = 0) { return 421; }

    location /503 {
        return 503;
    }

    location  ~ ^/(share/v1/chat/message|api/v1/creation/text)$ {
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        # Forward client information
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $security_forwarded_proto;
        proxy_set_header Host $http_host;

        proxy_pass http://backend;
    }

    location = /api/v1/file/upload {
        proxy_pass http://backend;

        client_max_body_size 1000m;

        # Forward client information
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $security_forwarded_proto;
        proxy_set_header Host $http_host;
    }

    location ~ ^/api {
        proxy_pass http://backend;

        client_max_body_size 1000m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 15m;
        proxy_read_timeout 15m;

        # Forward client information
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $security_forwarded_proto;
        proxy_set_header Host $http_host;
    }

    location ~ ^/share {
        proxy_pass http://backend;

        # Forward client information
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $security_forwarded_proto;
        proxy_set_header Host $http_host;
    }

    # Use a prefix location here because proxy_pass contains the OSS base path.
    # Nginx rejects a URI-bearing proxy_pass inside a regex location.
    location ^~ /static-file/ {
        proxy_pass ${OSS_DOWNLOAD_URL};

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;

        client_max_body_size 1000m;

        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        add_header Referrer-Policy "no-referrer" always;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $security_forwarded_proto;
        proxy_set_header Host $proxy_host;

        proxy_cache off;
        proxy_buffering off;
    }

    location / {
        root /opt/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ $uri.html /index.html;
        expires -1;
    }
}
