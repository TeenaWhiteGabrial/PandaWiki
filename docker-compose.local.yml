x-pandawiki-log-labels: &pandawiki-log-labels
  com.pandawiki.logs: 'true'

services:
  pdf-parser:
    build:
      context: ./services/pdf-parser
      args:
        PDF_PARSER_BASE_IMAGE: ${PDF_PARSER_BASE_IMAGE:-python:3.12-slim-bookworm}
        PDF_PARSER_APT_MIRROR: ${PDF_PARSER_APT_MIRROR:-https://deb.debian.org}
    container_name: panda-wiki-pdf-parser
    restart: unless-stopped
    labels: *pandawiki-log-labels
    mem_limit: 2g
    pids_limit: 128
    ports:
      - '127.0.0.1:18090:8090'
    environment:
      PDF_PARSER_TOKEN: ${PDF_PARSER_TOKEN:-}

  caddy:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-caddy:2.10-alpine
    container_name: panda-wiki-caddy
    restart: unless-stopped
    labels: *pandawiki-log-labels
    ports:
      - '2019:2019'
    environment:
      CADDY_ADMIN: 0.0.0.0:2019
    volumes:
      - panda_wiki_caddy_config:/config
      - panda_wiki_caddy_data:/data

  postgres:
    image: registry.cn-hangzhou.aliyuncs.com/misaka-images/postgres:15.17
    container_name: panda-wiki-postgres
    labels: *pandawiki-log-labels
    environment:
      POSTGRES_DB: panda-wiki
      POSTGRES_USER: panda-wiki
      POSTGRES_PASSWORD: panda-wiki-secret
    ports:
      - '15432:5432'
    volumes:
      - panda_wiki_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U panda-wiki -d panda-wiki']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: panda-wiki-redis
    labels: *pandawiki-log-labels
    ports:
      - '16379:6379'
    volumes:
      - panda_wiki_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  nats:
    image: registry.cn-hangzhou.aliyuncs.com/misaka-images/nats:2.14.1
    container_name: panda-wiki-nats
    labels: *pandawiki-log-labels
    command:
      - --jetstream
      - --store_dir
      - /data
      - --http_port
      - '8222'
    ports:
      - '4222:4222'
      - '8222:8222'
    volumes:
      - panda_wiki_nats:/data
    healthcheck:
      test: ['CMD', '/nats-server', '--version']
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: registry.cn-hangzhou.aliyuncs.com/misaka-images/qdrant:v1.14.1
    container_name: panda-wiki-qdrant
    labels: *pandawiki-log-labels
    environment:
      QDRANT__SERVICE__API_KEY: panda-wiki-qdrant-key
    ports:
      - '6333:6333'
    volumes:
      - panda_wiki_qdrant:/qdrant/storage

  crawler:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/anydoc:v0.9.11
    container_name: panda-wiki-crawler
    restart: unless-stopped
    labels: *pandawiki-log-labels
    init: true
    environment:
      GLOG_GLOBAL_LEVEL: info
      NAMESPACE: anydoc
      MQ_NATS_URL: nats://panda-wiki-nats:4222
      OSS_MINIO_ACCESS_KEY: ${OSS_ACCESS_KEY}
      OSS_MINIO_SECRET_KEY: ${OSS_SECRET_KEY}
      OSS_MINIO_ENDPOINT: ${OSS_S3_ENDPOINT}
      OSS_MINIO_USE_SSL: ${OSS_USE_SSL}
    ports:
      - '8080:8080'
    depends_on:
      nats:
        condition: service_started

  raglite:
    image: registry.cn-hangzhou.aliyuncs.com/misaka-images/raglite:v2.17.0
    container_name: panda-wiki-raglite
    restart: unless-stopped
    labels: *pandawiki-log-labels
    environment:
      GIN_MODE: release
      DATABASE_POSTGRESQL_HOST: panda-wiki-postgres
      DATABASE_POSTGRESQL_USER: panda-wiki
      DATABASE_POSTGRESQL_PASSWORD: panda-wiki-secret
      DATABASE_QDRANT_HOST: panda-wiki-qdrant
      DATABASE_QDRANT_API_KEY: panda-wiki-qdrant-key
      STORAGE_MINIO_ENDPOINT: ${OSS_S3_ENDPOINT}
      STORAGE_MINIO_ACCESS_KEY_ID: ${OSS_ACCESS_KEY}
      STORAGE_MINIO_SECRET_ACCESS_KEY: ${OSS_SECRET_KEY}
      STORAGE_MINIO_USE_SSL: ${OSS_USE_SSL}
      STORAGE_MINIO_BUCKET_NAME: ${OSS_BUCKET_NAME}
      NATS_URL: nats://panda-wiki-nats:4222
      EMBEDDER_RPM: 800
      LLM_RPM: 50
      # Disable RAGLite table LLM enhancement by default. Table text is still
      # indexed, but RAGLite will not call the analysis model to summarize tables.
      WORKER_MAX_TABLES: ${RAGLITE_WORKER_MAX_TABLES:-0}
    ports:
      - '5050:5050'
    volumes:
      - panda_wiki_raglite:/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  loki:
    image: registry.cn-hangzhou.aliyuncs.com/misaka-images/loki:3.7.0
    container_name: panda-wiki-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    ports:
      - '127.0.0.1:13100:3100'
    volumes:
      - ./deploy/server/logging/loki.yml:/etc/loki/config.yml:ro
      - panda_wiki_loki:/loki
    mem_limit: 768m

  alloy:
    image: registry.cn-hangzhou.aliyuncs.com/misaka-images/alloy:v1.11.3
    container_name: panda-wiki-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./deploy/server/logging/config.local.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.logs:/var/log/pandawiki:ro
    tmpfs:
      - /var/lib/alloy/data
    mem_limit: 256m
    depends_on:
      loki:
        condition: service_started

volumes:
  panda_wiki_caddy_config:
  panda_wiki_caddy_data:
  panda_wiki_postgres:
  panda_wiki_redis:
  panda_wiki_nats:
  panda_wiki_qdrant:
  panda_wiki_raglite:
  panda_wiki_loki:
