x-pandawiki-log-labels: &pandawiki-log-labels
  com.pandawiki.logs: 'true'

services:
  caddy:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-caddy:2.10-alpine
    container_name: panda-wiki-caddy
    restart: unless-stopped
    labels: *pandawiki-log-labels
    ports:
      - '2019:2019'
    environment:
      CADDY_ADMIN: 0.0.0.0:2019
    volumes:
      - panda_wiki_caddy_config:/config
      - panda_wiki_caddy_data:/data

  postgres:
    image: registry.cn-hangzhou.aliyuncs.com/misaka-images/postgres:15.17
    container_name: panda-wiki-postgres
    labels: *pandawiki-log-labels
    environment:
      POSTGRES_DB: panda-wiki
      POSTGRES_USER: panda-wiki
      POSTGRES_PASSWORD: panda-wiki-secret
    ports:
      - '15432:5432'
    volumes:
      - panda_wiki_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U panda-wiki -d panda-wiki']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: panda-wiki-redis
    labels: *pandawiki-log-labels
    ports:
      - '16379:6379'
    volumes:
      - panda_wiki_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  nats:
    image: registry.cn-hangzhou.aliyuncs.com/misaka-images/nats:2.14.1
    container_name: panda-wiki-nats
    labels: *pandawiki-log-labels
    command:
      - --jetstream
      - --store_dir
      - /data
    ports:
      - '4222:4222'
      - '8222:8222'
    volumes:
      - panda_wiki_nats:/data
    healthcheck:
      test: ['CMD', '/nats-server', '--version']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: registry.cn-hangzhou.aliyuncs.com/misaka-images/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1
    container_name: panda-wiki-minio
    labels: *pandawiki-log-labels
    environment:
      MINIO_ROOT_USER: s3panda-wiki
      MINIO_ROOT_PASSWORD: panda-wiki-secret
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - panda_wiki_minio:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://127.0.0.1:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-qdrant:v1.14.1
    container_name: panda-wiki-qdrant
    labels: *pandawiki-log-labels
    environment:
      QDRANT__SERVICE__API_KEY: panda-wiki-qdrant-key
    ports:
      - '6333:6333'
    volumes:
      - panda_wiki_qdrant:/qdrant/storage

  crawler:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/anydoc:v0.9.11
    container_name: panda-wiki-crawler
    restart: unless-stopped
    labels: *pandawiki-log-labels
    init: true
    environment:
      GLOG_GLOBAL_LEVEL: info
      NAMESPACE: anydoc
      MQ_NATS_URL: nats://panda-wiki-nats:4222
      OSS_MINIO_ACCESS_KEY: s3panda-wiki
      OSS_MINIO_SECRET_KEY: panda-wiki-secret
      OSS_MINIO_ENDPOINT: panda-wiki-minio:9000
    ports:
      - '8080:8080'
    depends_on:
      nats:
        condition: service_started
      minio:
        condition: service_healthy

  raglite:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/raglite:v2.17.0
    container_name: panda-wiki-raglite
    restart: unless-stopped
    labels: *pandawiki-log-labels
    environment:
      GIN_MODE: release
      DATABASE_POSTGRESQL_HOST: panda-wiki-postgres
      DATABASE_POSTGRESQL_USER: panda-wiki
      DATABASE_POSTGRESQL_PASSWORD: panda-wiki-secret
      DATABASE_QDRANT_HOST: panda-wiki-qdrant
      DATABASE_QDRANT_API_KEY: panda-wiki-qdrant-key
      STORAGE_MINIO_ENDPOINT: panda-wiki-minio:9000
      STORAGE_MINIO_ACCESS_KEY_ID: s3panda-wiki
      STORAGE_MINIO_SECRET_ACCESS_KEY: panda-wiki-secret
      NATS_URL: nats://panda-wiki-nats:4222
      EMBEDDER_RPM: 800
      LLM_RPM: 50
    ports:
      - '5050:5050'
    volumes:
      - panda_wiki_raglite:/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started

  loki:
    image: grafana/loki:3.7.0
    container_name: panda-wiki-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    ports:
      - '127.0.0.1:13100:3100'
    volumes:
      - ./deploy/server/logging/loki.yml:/etc/loki/config.yml:ro
      - panda_wiki_loki:/loki
    mem_limit: 768m

  alloy:
    image: grafana/alloy:v1.11.3
    container_name: panda-wiki-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./deploy/server/logging/config.local.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.logs:/var/log/pandawiki:ro
      - panda_wiki_alloy:/var/lib/alloy/data
    mem_limit: 256m
    depends_on:
      loki:
        condition: service_started

volumes:
  panda_wiki_caddy_config:
  panda_wiki_caddy_data:
  panda_wiki_postgres:
  panda_wiki_redis:
  panda_wiki_nats:
  panda_wiki_minio:
  panda_wiki_qdrant:
  panda_wiki_raglite:
  panda_wiki_loki:
  panda_wiki_alloy:
