x-pandawiki-log-labels: &pandawiki-log-labels
  com.pandawiki.logs: 'true'

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: ${PROJECT_NAME}-postgres
    restart: unless-stopped
    labels: *pandawiki-log-labels
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    volumes:
      - pandawiki_postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE}
    container_name: ${PROJECT_NAME}-redis
    restart: unless-stopped
    labels: *pandawiki-log-labels
    ports:
      - '127.0.0.1:${REDIS_PORT}:6379'
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/server/.env}
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?required}']
    volumes:
      - pandawiki_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  nats:
    image: ${NATS_IMAGE}
    container_name: ${PROJECT_NAME}-nats
    restart: unless-stopped
    labels: *pandawiki-log-labels
    command:
      - --jetstream
      - --store_dir
      - /data
      - --config
      - /etc/nats/security.conf
      - --user
      - panda-wiki
      - --pass
      - '${NATS_PASSWORD:?Set NATS_PASSWORD in deploy/server/.env}'
    ports:
      - '127.0.0.1:${NATS_PORT}:4222'
      - '127.0.0.1:${NATS_MONITOR_PORT}:8822'
    volumes:
      - pandawiki_nats:/data
      - ./security/nats.conf:/etc/nats/security.conf:ro

  nats-monitor:
    build:
      context: ../../web/admin
      dockerfile: security-proxy/Dockerfile
    container_name: ${PROJECT_NAME}-nats-monitor
    restart: unless-stopped
    labels: *pandawiki-log-labels
    network_mode: 'service:nats'
    environment:
      UPSTREAM_URL: http://127.0.0.1:8222
      PROXY_LISTEN: ':8822'
      PROXY_USERNAME: panda-wiki
      PROXY_PASSWORD: ${NATS_MONITOR_PASSWORD:-}
    depends_on:
      nats:
        condition: service_started

  qdrant:
    image: ${QDRANT_IMAGE}
    container_name: ${PROJECT_NAME}-qdrant
    restart: unless-stopped
    labels: *pandawiki-log-labels
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      - '127.0.0.1:${QDRANT_PORT}:6333'
    volumes:
      - pandawiki_qdrant:/qdrant/storage

  preview:
    image: registry.cn-hangzhou.aliyuncs.com/misaka-images/gotenberg:8
    container_name: ${PROJECT_NAME}-preview
    restart: unless-stopped
    labels: *pandawiki-log-labels
    command:
      - gotenberg
      - --api-timeout=300s
      - --libreoffice-disable-routes=false
      - --api-enable-basic-auth
    environment:
      GOTENBERG_API_BASIC_AUTH_USERNAME: panda-wiki
      GOTENBERG_API_BASIC_AUTH_PASSWORD: ${PREVIEW_PASSWORD:-}
    ports:
      - '127.0.0.1:${PREVIEW_PORT:-3000}:3000'

  raglite:
    image: ${RAGLITE_IMAGE}
    container_name: ${PROJECT_NAME}-raglite
    restart: unless-stopped
    labels: *pandawiki-log-labels
    environment:
      GIN_MODE: release
      API_KEY: ${RAGLITE_API_KEY}
      DATABASE_POSTGRESQL_HOST: ${PROJECT_NAME}-postgres
      DATABASE_POSTGRESQL_USER: ${POSTGRES_USER}
      DATABASE_POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_POSTGRESQL_DATABASE: ${RAGLITE_POSTGRES_DB}
      DATABASE_QDRANT_HOST: ${PROJECT_NAME}-qdrant
      DATABASE_QDRANT_API_KEY: ${QDRANT_API_KEY}
      STORAGE_MINIO_ENDPOINT: ${OSS_S3_ENDPOINT}
      STORAGE_MINIO_ACCESS_KEY_ID: ${OSS_ACCESS_KEY}
      STORAGE_MINIO_SECRET_ACCESS_KEY: ${OSS_SECRET_KEY}
      STORAGE_MINIO_USE_SSL: ${OSS_USE_SSL}
      STORAGE_MINIO_BUCKET_NAME: ${OSS_BUCKET_NAME}
      NATS_URL: nats://panda-wiki:${NATS_PASSWORD:?required}@${PROJECT_NAME}-nats:4222
      EMBEDDER_RPM: 800
      LLM_RPM: 50
      # Disable RAGLite table LLM enhancement by default. Table text is still
      # indexed, but RAGLite will not call the analysis model to summarize tables.
      WORKER_MAX_TABLES: ${RAGLITE_WORKER_MAX_TABLES:-0}
    ports:
      - '127.0.0.1:${RAGLITE_PORT}:5050'
    volumes:
      - pandawiki_raglite:/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      nats:
        condition: service_started

  pdf-parser:
    build:
      context: ../../services/pdf-parser
      args:
        PDF_PARSER_BASE_IMAGE: ${PDF_PARSER_BASE_IMAGE:-registry.cn-hangzhou.aliyuncs.com/misaka-images/python:3.12-slim-bookworm}
        PDF_PARSER_APT_MIRROR: ${PDF_PARSER_APT_MIRROR:-https://deb.debian.org}
    container_name: ${PROJECT_NAME}-pdf-parser
    restart: unless-stopped
    labels: *pandawiki-log-labels
    mem_limit: 2g
    pids_limit: 128
    environment:
      PDF_PARSER_TOKEN: ${PDF_PARSER_TOKEN:-}
      PDF_PARSER_WORKERS: ${PDF_PARSER_WORKERS:-1}
      PDF_PARSER_MAX_PAGES: ${PDF_PARSER_MAX_PAGES:-500}
      PDF_PARSER_JOB_TIMEOUT_SECONDS: ${PDF_PARSER_JOB_TIMEOUT_SECONDS:-900}

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile.api
      args:
        VERSION: local
    container_name: ${PROJECT_NAME}-api
    restart: unless-stopped
    labels: *pandawiki-log-labels
    environment:
      ENV: production
      SECURITY_ALLOWED_HOSTS: ${SECURITY_ALLOWED_HOSTS:-}
      SECURITY_ALLOWED_ORIGINS: ${SECURITY_ALLOWED_ORIGINS:-}
      SERVICE_NAME: api
      PDF_PARSER_URL: http://pdf-parser:8090
      PDF_PARSER_TOKEN: ${PDF_PARSER_TOKEN:-}
      ANYDOC_CRAWLER_BASE_URL: ${ANYDOC_CRAWLER_BASE_URL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SESSION_MAX_AGE_SECONDS: ${AUTH_SESSION_MAX_AGE_SECONDS:-28800}
      AUTH_SESSION_IDLE_SECONDS: ${AUTH_SESSION_IDLE_SECONDS:-1800}
      PG_DSN: host=${PROJECT_NAME}-postgres user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=5432 sslmode=disable TimeZone=Asia/Shanghai
      MQ_NATS_SERVER: nats://panda-wiki:${NATS_PASSWORD:?required}@${PROJECT_NAME}-nats:4222
      REDIS_ADDR: ${PROJECT_NAME}-redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME}
      OSS_DOWNLOAD_URL: ${OSS_DOWNLOAD_URL}
      OSS_REGION: ${OSS_REGION}
      RAG_CT_RAG_BASE_URL: http://${PROJECT_NAME}-raglite:5050
      SENTRY_ENABLED: ${SENTRY_ENABLED}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_STORE_URL: http://${PROJECT_NAME}-loki:3100
      CADDY_API: ''
      FILE_BASE_URL: ${OSS_DOWNLOAD_URL}/static-file
      ANYDOC_STATIC_FILE_BASE_URL: ${OSS_DOWNLOAD_URL}/static-file
      PREVIEW_BASE_URL: http://${PROJECT_NAME}-preview:3000
      PREVIEW_USERNAME: panda-wiki
      PREVIEW_PASSWORD: ${PREVIEW_PASSWORD:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - '${API_PORT}:8000'
    depends_on:
      pdf-parser:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      raglite:
        condition: service_started
      preview:
        condition: service_started
      loki:
        condition: service_started

  consumer:
    build:
      context: ../../backend
      dockerfile: Dockerfile.consumer
    container_name: ${PROJECT_NAME}-consumer
    restart: unless-stopped
    labels: *pandawiki-log-labels
    environment:
      ENV: production
      SECURITY_ALLOWED_HOSTS: ${SECURITY_ALLOWED_HOSTS:-}
      SECURITY_ALLOWED_ORIGINS: ${SECURITY_ALLOWED_ORIGINS:-}
      SERVICE_NAME: consumer
      PDF_PARSER_URL: http://pdf-parser:8090
      PDF_PARSER_TOKEN: ${PDF_PARSER_TOKEN:-}
      ANYDOC_CRAWLER_BASE_URL: ${ANYDOC_CRAWLER_BASE_URL:-}
      PG_DSN: host=${PROJECT_NAME}-postgres user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=5432 sslmode=disable TimeZone=Asia/Shanghai
      MQ_NATS_SERVER: nats://panda-wiki:${NATS_PASSWORD:?required}@${PROJECT_NAME}-nats:4222
      REDIS_ADDR: ${PROJECT_NAME}-redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME}
      OSS_DOWNLOAD_URL: ${OSS_DOWNLOAD_URL}
      OSS_REGION: ${OSS_REGION}
      RAG_CT_RAG_BASE_URL: http://${PROJECT_NAME}-raglite:5050
      SENTRY_ENABLED: ${SENTRY_ENABLED}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_STORE_URL: http://${PROJECT_NAME}-loki:3100
      FILE_BASE_URL: ${OSS_DOWNLOAD_URL}/static-file
      ANYDOC_STATIC_FILE_BASE_URL: ${OSS_DOWNLOAD_URL}/static-file
      PREVIEW_BASE_URL: http://${PROJECT_NAME}-preview:3000
      PREVIEW_USERNAME: panda-wiki
      PREVIEW_PASSWORD: ${PREVIEW_PASSWORD:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    depends_on:
      api:
        condition: service_started

  admin-build:
    image: registry.cn-hangzhou.aliyuncs.com/misaka-images/node:22-alpine
    container_name: ${PROJECT_NAME}-admin-build
    labels: *pandawiki-log-labels
    working_dir: /workspace/web
    environment:
      TARGET: http://${SERVER_IP}:${API_PORT}
      STATIC_FILE_TARGET: ${OSS_DOWNLOAD_URL}
      SWAGGER_BASE_URL: http://${SERVER_IP}:${API_PORT}
      NODE_OPTIONS: --max-old-space-size=4096
      CI: 'true'
      COREPACK_NPM_REGISTRY: ${COREPACK_NPM_REGISTRY:-https://registry.npmmirror.com}
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
    command: >
      sh -lc "
      corepack enable &&
      pnpm install --frozen-lockfile=false &&
      pnpm --filter panda-wiki-admin build
      "
    volumes:
      - ../../:/workspace
      - pandawiki_pnpm_store:/root/.local/share/pnpm/store
    restart: 'no'

  app-build:
    image: registry.cn-hangzhou.aliyuncs.com/misaka-images/node:22-alpine
    container_name: ${PROJECT_NAME}-app-build
    labels: *pandawiki-log-labels
    working_dir: /workspace/web
    environment:
      TARGET: http://${SERVER_IP}:${API_PORT}
      STATIC_FILE_TARGET: ${OSS_DOWNLOAD_URL}
      SWAGGER_BASE_URL: http://${SERVER_IP}:${API_PORT}
      DEV_KB_ID: ''
      NODE_OPTIONS: --max-old-space-size=4096
      CI: 'true'
      COREPACK_NPM_REGISTRY: ${COREPACK_NPM_REGISTRY:-https://registry.npmmirror.com}
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
    command: >
      sh -lc "
      corepack enable &&
      pnpm install --frozen-lockfile=false &&
      pnpm --filter panda-wiki-app build
      "
    volumes:
      - ../../:/workspace
      - pandawiki_pnpm_store:/root/.local/share/pnpm/store
    restart: 'no'

  admin:
    build:
      context: ../../web/admin
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}-admin
    restart: unless-stopped
    labels: *pandawiki-log-labels
    environment:
      SECURITY_ALLOWED_HOSTS: ${SECURITY_ALLOWED_HOSTS:-}
      OSS_DOWNLOAD_URL: ${OSS_DOWNLOAD_URL}
    ports:
      - '${ADMIN_PORT}:80'
    depends_on:
      admin-build:
        condition: service_completed_successfully

  app:
    build:
      context: ../../web/app
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}-app
    restart: unless-stopped
    labels: *pandawiki-log-labels
    environment:
      SECURITY_ALLOWED_HOSTS: ${SECURITY_ALLOWED_HOSTS:-}
      TARGET: http://api:8000
      STATIC_FILE_TARGET: ${OSS_DOWNLOAD_URL}
      PORT: 3010
      HOSTNAME: 0.0.0.0
    ports:
      - '${APP_PORT}:3010'
    depends_on:
      app-build:
        condition: service_completed_successfully

  loki:
    image: registry.cn-hangzhou.aliyuncs.com/misaka-images/loki:3.7.0
    container_name: ${PROJECT_NAME}-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./logging/loki.yml:/etc/loki/config.yml:ro
      - pandawiki_loki:/loki
    mem_limit: 768m

  alloy:
    image: registry.cn-hangzhou.aliyuncs.com/misaka-images/alloy:v1.11.3
    container_name: ${PROJECT_NAME}-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./logging/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - pandawiki_alloy:/var/lib/alloy/data
    mem_limit: 256m
    depends_on:
      loki:
        condition: service_started

volumes:
  pandawiki_postgres:
  pandawiki_redis:
  pandawiki_nats:
  pandawiki_qdrant:
  pandawiki_raglite:
  pandawiki_pnpm_store:
  pandawiki_loki:
  pandawiki_alloy:
